name: Lockfile guard (reusable)

# Reusable workflow: proves the calling repo's lockfile(s) are well-formed and
# in sync with their manifests, so a corrupted lockfile cannot reach the
# default branch and then break every later install. Ecosystem-detecting — one
# workflow serves pnpm, npm and uv repos. Call it with:
#
#   on:
#     pull_request:
#     push:
#       branches: [main]
#     merge_group:            # only if the repo uses a merge queue
#   jobs:
#     lockfile:
#       uses: kornsour/gh-automation/.github/workflows/lockfile-guard.yml@v1
#
# The resulting required-check context is "lockfile / integrity".
#
# Checks (each runs only for the lockfiles that exist):
#   all     a strict parse: syntax errors, DUPLICATE KEYS and git conflict
#           markers fail (pnpm-lock.yaml, package-lock.json, uv.lock)
#   pnpm    pnpm install --frozen-lockfile --lockfile-only   (drift + parse)
#   npm     npm ci --dry-run                                  (drift)
#   uv      uv lock --check                                   (drift)
# A repo with none of these lockfiles passes (nothing to check).
#
# `strict-only: true` runs just the strict parse — seconds, no installs. Use it
# for the push-to-main BACKSTOP, which catches a corrupted lockfile the moment
# it lands (e.g. two PRs that merged textually clean into a duplicate key):
#
#   on:
#     push:
#       branches: [main]
#   jobs:
#     lockfile:
#       uses: kornsour/gh-automation/.github/workflows/lockfile-guard.yml@v1
#       with:
#         strict-only: true
#
# A push run only happens if the merge was made by a real identity — merges
# enabled/performed with GITHUB_TOKEN start no workflows. See AUTOMERGE_TOKEN
# in dependabot-auto-merge.yml.
#
# There is deliberately NO actor condition anywhere: Dependabot PRs are the
# main source of lockfile corruption and are checked exactly like any other.
#
# The detect and strict steps call scripts/lockfile-check/lockfile-check.sh —
# the same script dependabot-auto-merge.yml runs immediately before merging.
# tests/lockfile-guard/run-tests.sh tests that script, plus the drift steps
# below (extracted from this file by step id — edit them here, not there).

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory containing the lockfile(s), relative to the repo root"
        type: string
        default: "."
      ecosystems:
        description: "Comma list of pnpm,npm,uv to check, or 'auto' to detect from the lockfiles present. An explicitly named ecosystem whose lockfile is missing fails."
        type: string
        default: "auto"
      node-version:
        description: "Node.js version used for the pnpm/npm checks"
        type: string
        default: "24"
      pnpm-version:
        description: "pnpm version for the frozen-lockfile check; empty = the package.json packageManager pin, else 10"
        type: string
        default: ""
      merge-base:
        description: "On pull_request, merge the CURRENT base branch tip into the checkout before checking, so a lockfile that only breaks in combination with a newer base is caught"
        type: boolean
        default: true
      strict-only:
        description: "Run ONLY the strict parse (duplicate keys, syntax, conflict markers) and skip the Node/pnpm/npm/uv drift checks. Seconds, no network installs; meant for the push-to-main backstop."
        type: boolean
        default: false
      tooling-ref:
        description: "Ref of kornsour/gh-automation to fetch the shared lockfile-check script from. Empty = the ref the caller pinned this workflow to, else v1."
        type: string
        default: ""

permissions:
  contents: read

# The scripts below are bash (heredocs, arrays, pipefail). Windows runners
# default to PowerShell, which cannot parse them, so pin the shell
# workflow-wide. No-op on ubuntu-latest, where bash is already the default.
defaults:
  run:
    shell: bash

# Self-hosted runners are opt-in via the caller's USE_SELF_HOSTED_RUNNER repo
# var, and additionally gated to private repos: on a public repo a fork PR
# could run arbitrary code on the runner, so public callers always get
# GitHub-hosted regardless of the var.
jobs:
  integrity:
    name: integrity
    runs-on: ${{ fromJSON(vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A PR needs history to merge the current base tip in (next step).
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}

      # BEGIN shared tooling step (kept identical, apart from an `if:` line, in
      # lockfile-guard.yml and dependabot-auto-merge.yml; run-tests.sh enforces it)
      # The lockfile checks live in ONE script, scripts/lockfile-check/, in
      # kornsour/gh-automation. A reusable workflow cannot see its own repo's
      # files, so fetch them — at the same ref the caller pinned this workflow
      # to (read from the caller's workflow file), or `tooling-ref` if given,
      # else v1. Plain git, outside the workspace; no extra action.
      - name: Fetch gh-automation lockfile tooling
        id: tooling
        env:
          TOOLING_REF: ${{ inputs.tooling-ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          ref="$TOOLING_REF"
          caller="${CALLER_WORKFLOW_REF#*/*/}"; caller="${caller%%@*}"
          if [ -z "$ref" ] && [ -f "$caller" ]; then
            ref="$(grep -oiE '(kornsour|lurking-walrus)/gh-automation/\.github/workflows/[A-Za-z0-9_.-]+@[^[:space:]"#]+' "$caller" | head -n1 | sed 's/.*@//' || true)"
          fi
          ref="${ref:-v1}"
          dir="${RUNNER_TEMP:?}/gh-automation-tooling"
          rm -rf "$dir" && git init --quiet "$dir"
          git -C "$dir" fetch --quiet --depth 1 https://github.com/kornsour/gh-automation.git "$ref"
          git -C "$dir" checkout --quiet --detach FETCH_HEAD
          script="$dir/scripts/lockfile-check/lockfile-check.sh"
          [ -x "$script" ] || { echo "::error::gh-automation@$ref has no scripts/lockfile-check; set tooling-ref to a ref that does"; exit 1; }
          echo "LOCKFILE_CHECK=$script" >> "$GITHUB_ENV"
          echo "Lockfile tooling: kornsour/gh-automation@$ref ($(git -C "$dir" rev-parse HEAD))"
      # END shared tooling step

      # A PR is checked as GitHub's pre-computed merge ref, which can already
      # be stale: two Dependabot PRs that each touch pnpm-lock.yaml can both
      # pass, then merge textually clean into a duplicated key. Re-merging the
      # base tip as it is NOW narrows that window. A conflict only warns —
      # GitHub will not let a conflicting PR merge anyway.
      - name: Merge current base branch into the checkout
        if: ${{ github.event_name == 'pull_request' && inputs.merge-base }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git config user.email "lockfile-guard@users.noreply.github.com"
          git config user.name "lockfile-guard"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git merge-base --is-ancestor "origin/${BASE_REF}" HEAD; then
            echo "Checkout already contains origin/${BASE_REF}."
            exit 0
          fi
          if git merge --no-edit --no-ff "origin/${BASE_REF}"; then
            echo "Merged current origin/${BASE_REF} into the checkout."
          else
            git merge --abort || true
            echo "::warning::Could not merge origin/${BASE_REF} cleanly; checking the PR merge ref as-is."
          fi

      - name: Detect lockfiles
        id: detect
        working-directory: ${{ inputs.working-directory }}
        env:
          ECOSYSTEMS: ${{ inputs.ecosystems }}
        run: '"$LOCKFILE_CHECK" detect'

      # Syntax errors, DUPLICATE KEYS and conflict markers. The same script is
      # what dependabot-auto-merge.yml runs immediately before it merges.
      - name: Strict parse of lockfiles (syntax, duplicate keys, conflict markers)
        id: strict
        if: ${{ steps.detect.outputs.any == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GUARD_PNPM: ${{ steps.detect.outputs.pnpm }}
          GUARD_NPM: ${{ steps.detect.outputs.npm }}
          GUARD_UV: ${{ steps.detect.outputs.uv }}
        run: '"$LOCKFILE_CHECK" strict'

      # Everything below is the manifest-drift layer: it needs Node/pnpm/uv and
      # network, so `strict-only: true` (the push backstop) skips it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ !inputs.strict-only && steps.detect.outputs.js == 'true' }}
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install pnpm
        id: pnpm-install
        if: ${{ !inputs.strict-only && steps.detect.outputs.pnpm == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          set -euo pipefail
          v="$PNPM_VERSION"
          if [ -z "$v" ] && [ -f package.json ]; then
            # packageManager looks like "pnpm@10.33.0" or "pnpm@10.33.0+sha512.…"
            v="$(sed -n 's/.*"packageManager"[[:space:]]*:[[:space:]]*"pnpm@\([0-9][^"+]*\).*/\1/p' package.json | head -n1)"
          fi
          v="${v:-10}"
          prefix="${RUNNER_TEMP:?}/lockfile-guard-pnpm"
          npm install --prefix "$prefix" "pnpm@${v}" --no-audit --no-fund --ignore-scripts --loglevel=error
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "Installed pnpm@${v}"

      # Parses the lockfile with pnpm's own parser AND proves it matches
      # package.json. --lockfile-only never populates node_modules.
      - name: pnpm — frozen lockfile
        id: pnpm-check
        if: ${{ !inputs.strict-only && steps.detect.outputs.pnpm == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: pnpm install --frozen-lockfile --lockfile-only --ignore-scripts

      - name: npm — lockfile in sync with package.json
        id: npm-check
        if: ${{ !inputs.strict-only && steps.detect.outputs.npm == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: npm ci --dry-run --ignore-scripts --no-audit --no-fund

      - name: Install uv
        if: ${{ !inputs.strict-only && steps.detect.outputs.uv == 'true' }}
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: uv — lockfile up to date
        id: uv-check
        if: ${{ !inputs.strict-only && steps.detect.outputs.uv == 'true' }}
        working-directory: ${{ inputs.working-directory }}
        run: uv lock --check
