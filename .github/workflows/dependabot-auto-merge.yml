name: Dependabot auto-merge (reusable)

# Reusable workflow: auto-merges Dependabot patch/minor PRs once the calling
# repo's required status checks pass. Call it from a repo with:
#
#   jobs:
#     automerge:
#       uses: kornsour/gh-automation/.github/workflows/dependabot-auto-merge.yml@v1
#
# Do not pass `secrets: inherit`. This workflow declares no `secrets:` below and
# uses only `secrets.GITHUB_TOKEN`, which GitHub provides automatically.
#
# Majors are left for manual review. See kornsour/gh-automation/README.md.

on:
  workflow_call:
    inputs:
      merge-method:
        description: "merge | squash | rebase"
        type: string
        default: squash

permissions:
  contents: write
  pull-requests: write

# Self-hosted runners are opt-in via the caller's USE_SELF_HOSTED_RUNNER repo
# var, and additionally gated to private repos: on a public repo a fork PR
# could run arbitrary code on the runner, so public callers always get
# GitHub-hosted regardless of the var.
jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ${{ fromJSON(vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        # v2 (through 2.5.0) has a regex bug that returns `update-type: null`
        # for pip "update X requirement from A to B" PRs once the title picks
        # up a commit-message prefix (e.g. "build(deps-dev): update ruff
        # requirement..."), which silently skips auto-merge even for safe
        # patch/minor bumps. Fixed in v3.1.0: dependabot/fetch-metadata#704.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch & minor
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --${{ inputs.merge-method }} "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note majors left for manual review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update (${{ steps.meta.outputs.dependency-names }}) — manual review."
