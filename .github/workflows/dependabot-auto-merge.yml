name: Dependabot auto-merge (reusable)

# Reusable workflow: auto-merges Dependabot PRs -- patch, minor and major --
# once the calling repo's required status checks pass. Call it from a repo with:
#
#   jobs:
#     automerge:
#       uses: kornsour/gh-automation/.github/workflows/dependabot-auto-merge.yml@v1
#       with:
#         require-token: true
#       secrets:
#         AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
#
# WHICH TOKEN ENABLES AUTO-MERGE MATTERS. GitHub performs the eventual merge on
# behalf of whoever enabled auto-merge, and events caused by GITHUB_TOKEN never
# start workflow runs -- so a merge enabled with GITHUB_TOKEN lands on main
# WITHOUT triggering the caller's push workflows (CI on main, Pages, image
# publish, deploys, releases). Pass AUTOMERGE_TOKEN -- a fine-grained PAT (or a
# GitHub App installation token) with Contents, Pull requests and Workflows
# read/write on the repo -- and the merge is attributed to that identity, so
# push workflows run normally. It must be stored as a *Dependabot* secret in the
# caller (Settings > Secrets and variables > Dependabot): this workflow runs as
# dependabot[bot], which can only read Dependabot secrets, never Actions secrets.
#
# Without the secret the workflow falls back to GITHUB_TOKEN and warns, so
# callers that predate the secret keep working. Set `require-token: true` to
# fail instead -- the right choice for any repo whose push workflows matter.
#
# Do not pass `secrets: inherit`; pass AUTOMERGE_TOKEN by name.
#
# Green CI is the whole gate, majors included. Set `merge-majors: false` to
# hold semver-major updates for manual review instead.
# See kornsour/gh-automation/README.md.

on:
  workflow_call:
    inputs:
      merge-method:
        description: "merge | squash | rebase"
        type: string
        default: squash
      merge-majors:
        description: "Auto-merge semver-major updates too (set false to hold majors for manual review)"
        type: boolean
        default: true
      require-token:
        description: "Fail rather than fall back to GITHUB_TOKEN when AUTOMERGE_TOKEN is not provided"
        type: boolean
        default: false
    secrets:
      AUTOMERGE_TOKEN:
        description: "Token that enables auto-merge, so the merge triggers the caller's push workflows. Store it as a Dependabot secret."
        required: false

permissions:
  contents: write
  pull-requests: write

# Self-hosted runners are opt-in via the caller's USE_SELF_HOSTED_RUNNER repo
# var, and additionally gated to private repos: on a public repo a fork PR
# could run arbitrary code on the runner, so public callers always get
# GitHub-hosted regardless of the var.
jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ${{ fromJSON(vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        # v2 (through 2.5.0) has a regex bug that returns `update-type: null`
        # for pip "update X requirement from A to B" PRs once the title picks
        # up a commit-message prefix (e.g. "build(deps-dev): update ruff
        # requirement..."), which silently skips auto-merge even for safe
        # patch/minor bumps. Fixed in v3.1.0: dependabot/fetch-metadata#704.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this update is eligible
        id: policy
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDENCIES: ${{ steps.meta.outputs.dependency-names }}
          MERGE_MAJORS: ${{ inputs.merge-majors }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "eligible=true" >> "$GITHUB_OUTPUT" ;;
            version-update:semver-major)
              if [ "$MERGE_MAJORS" = "true" ]; then
                echo "eligible=true" >> "$GITHUB_OUTPUT"
              else
                echo "Major update ($DEPENDENCIES) — manual review."
                echo "eligible=false" >> "$GITHUB_OUTPUT"
              fi ;;
            *)
              echo "No semver update type reported (update-type='$UPDATE_TYPE') — manual review."
              echo "eligible=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Resolve the token that will enable auto-merge
        if: steps.policy.outputs.eligible == 'true'
        env:
          HAVE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN != '' }}
          REQUIRE_TOKEN: ${{ inputs.require-token }}
        run: |
          set -euo pipefail
          if [ "$HAVE_TOKEN" = "true" ]; then
            echo "Enabling auto-merge with AUTOMERGE_TOKEN; the merge will trigger push workflows on main."
          elif [ "$REQUIRE_TOKEN" = "true" ]; then
            echo "::error title=AUTOMERGE_TOKEN is not set::This repo requires a merge token so the Dependabot merge triggers its push workflows. Create a fine-grained PAT (Contents, Pull requests, Workflows: read/write on this repo) and store it as a Dependabot secret: gh secret set AUTOMERGE_TOKEN --app dependabot -R ${GITHUB_REPOSITORY}. See kornsour/gh-automation README."
            exit 1
          else
            echo "::warning title=Falling back to GITHUB_TOKEN::The resulting merge will NOT trigger this repo's push workflows on main (CI, deploys, releases). Pass AUTOMERGE_TOKEN to fix that; see kornsour/gh-automation README."
          fi

      - name: Enable auto-merge
        if: steps.policy.outputs.eligible == 'true'
        run: gh pr merge --auto --${{ inputs.merge-method }} "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
