name: CI (reusable)

# Reusable standardized CI for template-derived repos: Biome, type-check, unit
# tests, build, and (optionally) a schema/migration guard. Call it with:
#
#   jobs:
#     ci:
#       uses: kornsour/gh-automation/.github/workflows/ci.yml@v1
#       with:
#         migration-check: true   # set false for repos with no src/db/schema.ts
#
# Resulting required-check contexts are prefixed by the caller job name, e.g.
# "ci / Lint & format (Biome)", "ci / Build", "ci / DB migration check".

on:
  workflow_call:
    inputs:
      migration-check:
        description: "Require a drizzle migration when src/db/schema.ts changes"
        type: boolean
        default: false
      node-version:
        description: "Node.js version"
        type: string
        default: "24"
      security-scan:
        description: "Run the Semgrep security scan job"
        type: boolean
        default: true

permissions:
  contents: read

# `run:` steps here are written in bash (heredocs, <<<, grep, set -euo pipefail).
# Windows runners default to PowerShell, which cannot parse any of it, so pin the
# shell workflow-wide. No-op on ubuntu-latest, where bash is already the default.
defaults:
  run:
    shell: bash

env:
  SKIP_ENV_VALIDATION: "1"

# Self-hosted runners are opt-in via the caller's USE_SELF_HOSTED_RUNNER repo
# var, and additionally gated to private repos: on a public repo a fork PR
# could run arbitrary code on the runner, so public callers always get
# GitHub-hosted regardless of the var.
jobs:
  check:
    name: Lint & format (Biome)
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  typecheck:
    name: Type check
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit

  test:
    name: Unit tests (Vitest)
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    env:
      # Placeholders so module-load code (auth/db clients) doesn't trip during
      # build; SKIP_ENV_VALIDATION (workflow-level) bypasses env validation.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/build"
      BETTER_AUTH_SECRET: "ci-build-placeholder-secret-not-used-at-runtime"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  migration-check:
    name: DB migration check
    if: ${{ inputs.migration-check && github.event_name == 'pull_request' }}
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a migration when schema.ts changes
        env:
          BASE: origin/${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${BASE}...HEAD")"
          if ! grep -qx "src/db/schema.ts" <<<"$changed"; then
            echo "✓ src/db/schema.ts unchanged — no migration required."; exit 0
          fi
          if grep -q "^drizzle/" <<<"$changed"; then
            echo "✓ schema changed and a drizzle/ migration was added."; exit 0
          fi
          echo "::error::src/db/schema.ts changed but no drizzle/ migration added. Run: pnpm db:generate --name <name>"
          exit 1

  security:
    name: Security scan (Semgrep)
    if: ${{ inputs.security-scan }}
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Semgrep
        # Pinned: an unpinned scanner turns a rules release into a surprise
        # red build on an unrelated PR. Bump deliberately.
        run: pip install --disable-pip-version-check --quiet semgrep==1.172.0
      - name: Scan
        # `|| true` because semgrep exits 1 on any finding; the gate below
        # decides what is blocking. A real crash still surfaces as missing
        # JSON, which the next step reports.
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/react \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --metrics=off \
            --quiet \
            --json \
            --output=semgrep.json \
            --exclude=node_modules \
            --exclude=.next \
            --exclude=dist \
            --exclude=build \
            || true
      - name: Report and gate
        # ERROR severity blocks; WARNING/INFO are reported only. These repos
        # carry a standing warning backlog, so gating on everything would mean
        # a permanently red CI that nobody reads.
        run: |
          set -euo pipefail
          if [ ! -s semgrep.json ]; then
            echo "::error::Semgrep produced no output — the scan itself failed."
            exit 1
          fi
          errors=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' semgrep.json)
          {
            echo "### Semgrep"
            echo
            echo "| Severity | Count |"
            echo "| --- | --- |"
            jq -r '[.results[].extra.severity] | group_by(.)
                   | map("| \(.[0]) | \(length) |") | .[]' semgrep.json
            echo
            echo "_ERROR blocks the build; WARNING and INFO are advisory._"
          } >> "$GITHUB_STEP_SUMMARY"
          jq -r '.results[] | select(.extra.severity == "ERROR")
                 | "::error file=\(.path),line=\(.start.line)::\(.extra.message | split("\n")[0])"' semgrep.json
          if [ "$errors" -gt 0 ]; then
            echo "Blocking: $errors ERROR-severity finding(s)."
            exit 1
          fi
          echo "No ERROR-severity findings."
