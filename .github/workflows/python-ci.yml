name: Python CI (reusable)

# Reusable standardized CI for Python template-derived repos. Runs ruff lint +
# format check, pyright type-check, and pytest in a SINGLE job to minimize
# billed Actions minutes (one runner, one dependency install — cheaper than a
# job-per-check fan-out). Call it with:
#
#   jobs:
#     ci:
#       uses: kornsour/gh-automation/.github/workflows/python-ci.yml@v1
#       with:
#         python-version: "3.14"   # optional
#         extras: "dev"            # optional PEP 508 extras to install
#         validate-opentofu: true   # optional IaC syntax/provider validation
#
# Only the given extras are installed (default: dev), so heavy runtime
# frameworks (torch/jax/...) never download in CI. Resulting required-check
# context: "ci / Lint, type-check & test".
#
# Installs via `uv sync --frozen`, not `uv pip install`: a committed uv.lock
# is only worth anything if CI actually installs what it pins rather than
# re-resolving from the project's `>=` ranges every run. `--frozen` refuses
# to touch the lockfile at all, so a stale lock fails loudly here (the
# "Lockfile up to date" step below) instead of installing silently-different
# versions from what a contributor tested locally.

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version"
        type: string
        default: "3.14"
      extras:
        description: "Optional-dependency extras to install (comma-separated)"
        type: string
        default: "dev"
      validate-opentofu:
        description: "Run OpenTofu init (without backend) and validate"
        type: boolean
        default: false
      opentofu-directory:
        description: "Directory holding the OpenTofu configuration"
        type: string
        default: "infra"

permissions:
  contents: read

# Self-hosted runners are opt-in via the caller's USE_SELF_HOSTED_RUNNER repo
# var, and additionally gated to private repos: on a public repo a fork PR
# could run arbitrary code on the runner, so public callers always get
# GitHub-hosted regardless of the var.
jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ${{ fromJSON(vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Lockfile up to date
        run: uv lock --check

      - name: Install (given extras only — no heavy runtime frameworks)
        # --frozen: install exactly what uv.lock pins, never re-resolve.
        # One --extra flag per comma-separated name (uv sync doesn't accept
        # uv pip install's "a,b" single-flag form).
        run: |
          extras=()
          IFS=',' read -ra names <<< "${{ inputs.extras }}"
          for name in "${names[@]}"; do
            extras+=(--extra "$name")
          done
          uv sync --frozen "${extras[@]}"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Tests (pytest)
        run: uv run pytest

  opentofu:
    if: inputs.validate-opentofu
    name: IaC validate
    runs-on: ${{ fromJSON(vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && '["self-hosted","Linux","X64"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1

      - name: Initialize providers without state backend
        working-directory: ${{ inputs.opentofu-directory }}
        run: tofu init -backend=false

      - name: Validate configuration
        working-directory: ${{ inputs.opentofu-directory }}
        run: tofu validate
